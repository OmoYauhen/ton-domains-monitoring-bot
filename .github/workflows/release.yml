name: release

# Build a static musl binary on every merge to main and cut a GitHub Release
# with an auto-incremented patch-level semver tag (vMAJOR.MINOR.PATCH).
#
# The musl target produces a fully static binary that runs on NixOS as-is
# (no autoPatchelfHook / interpreter fixups needed), so it can be pulled into
# a systemd/NixOS service straight from the release asset via fetchurl.

on:
  push:
    branches: [main]

# Don't let two merges race on tag creation.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-musl
  BIN: ton-domains-monitoring

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so we can compute the next version.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Build static release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            # No release yet: seed from the version in Cargo.toml.
            base="$(sed -n 's/^version *= *"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' Cargo.toml | head -n1)"
            next="${base:-0.1.0}"
          else
            v="${latest#v}"
            major="${v%%.*}"; rest="${v#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${next} (previous: ${latest:-none})"

      - name: Stage binary asset
        run: |
          set -euo pipefail
          asset="${BIN}-${{ steps.ver.outputs.tag }}-${TARGET}"
          cp "target/${TARGET}/release/${BIN}" "$asset"
          sha256sum "$asset" > "${asset}.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" \
            "$asset" "${asset}.sha256" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes
